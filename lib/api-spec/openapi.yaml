openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: AMIN AI DESK analysis, market radar, and paper-trading API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: agents
    description: Agent analysis operations
  - name: market
    description: Public market data
  - name: paper
    description: Simulated paper portfolio
  - name: settings
    description: User preferences
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /market-scanner/analyze:
    post:
      operationId: analyzeMarketScanner
      tags: [agents]
      summary: Analyze a market question with the Market Scanner
      description: Sends a question to the server-configured Gemini model. API credentials are never returned to the client.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketScannerRequest"
      responses:
        "200":
          description: Gemini-generated Market Scanner analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketScannerResponse"
        "400":
          description: The question is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketScannerError"
        "429":
          description: Gemini quota or rate limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketScannerError"
        "502":
          description: Gemini could not provide an analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketScannerError"
        "503":
          description: Gemini is not configured or is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketScannerError"
        "504":
          description: Gemini request timed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketScannerError"
  /analysis/run:
    post:
      operationId: startAnalysisRun
      tags: [agents]
      summary: Start a server-orchestrated analysis run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysisRunRequest"
      responses:
        "202":
          description: Run accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisRunStart"
        "400":
          description: Invalid question, asset, or account identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    get:
      operationId: getAnalysisRun
      tags: [agents]
      summary: Get the latest status and agent results for a run
      parameters:
        - name: runId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: accountId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Run and currently available results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisRun"
        "404":
          description: Run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /analysis/run/stop:
    post:
      operationId: stopAnalysisRun
      tags: [agents]
      summary: Stop an in-progress run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StopAnalysisRunRequest"
      responses:
        "200":
          description: Run stop status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisRunStart"
        "404":
          description: Run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /analysis/history:
    get:
      operationId: getAnalysisHistory
      tags: [agents]
      summary: List recent analysis runs for an account
      parameters:
        - name: accountId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Recent runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisHistory"
  /radar:
    get:
      operationId: getRadar
      tags: [market]
      summary: Get source-backed radar data for supported assets
      responses:
        "200":
          description: Radar with explicit source freshness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadarResponse"
  /radar/performance:
    get:
      operationId: getRadarPerformance
      tags: [market]
      summary: Get outcome-based performance of recorded radar signals
      responses:
        "200":
          description: Recorded outcome aggregates by asset, signal type, and horizon
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadarPerformanceResponse"
        "503":
          description: Signal evaluation data is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /radar/signals:
    get:
      operationId: getRadarSignals
      tags: [market]
      summary: Get immutable signal snapshots and real market-data evaluations
      responses:
        "200":
          description: Recent signal snapshots and evaluation state by horizon
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadarSignalHistoryResponse"
        "503":
          description: Signal history is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /paper/portfolio:
    get:
      operationId: getPaperPortfolio
      tags: [paper]
      summary: Get the demo portfolio, positions, history, and performance
      parameters:
        - name: accountId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Paper portfolio snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaperPortfolio"
  /paper/performance:
    get:
      operationId: getPaperPerformance
      tags: [paper]
      summary: Get measured paper-trade performance for an account
      parameters:
        - name: accountId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Performance computed from closed demo positions only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaperPerformance"
  /paper/trades:
    post:
      operationId: openPaperTrade
      tags: [paper]
      summary: Open a demo position linked to an analysis run or recorded radar signal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenPaperTradeRequest"
      responses:
        "201":
          description: Demo position opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaperTradeResult"
        "400":
          description: Invalid order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Insufficient demo balance or signal is not actionable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Current market price is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /paper/trades/{positionId}/close:
    post:
      operationId: closePaperTrade
      tags: [paper]
      summary: Close an open demo position at the latest available price
      parameters:
        - name: positionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaperAccountRequest"
      responses:
        "200":
          description: Demo position closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaperTradeResult"
        "404":
          description: Position not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: Current market price is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /paper/reset:
    post:
      operationId: resetPaperPortfolio
      tags: [paper]
      summary: Reset demo capital and clear paper-trading history
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPaperRequest"
      responses:
        "200":
          description: Demo portfolio reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaperPortfolio"
  /settings:
    get:
      operationId: getDeskSettings
      tags: [settings]
      summary: Get paper account and scoring settings
      parameters:
        - name: accountId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeskSettings"
    put:
      operationId: updateDeskSettings
      tags: [settings]
      summary: Update paper capital and scoring weights
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDeskSettingsRequest"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeskSettings"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    MarketScannerRequest:
      type: object
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 2000
      required:
        - question
    MarketScannerResponse:
      type: object
      properties:
        analysis:
          type: string
      required:
        - analysis
    MarketScannerError:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
      required:
        - error
        - code
    ApiError:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
      required: [error, code]
    AssetCode:
      type: string
      enum: [BTC, ETH, SOL, BNB, XRP, ADA, DOGE, AVAX, LINK, LTC, COIN, MSTR, NVDA, ASML, TSM, AAPL, MSFT, DAX, XAU, OIL]
    DataStatus:
      type: string
      enum: [live, stale, missing]
    AgentStatus:
      type: string
      enum: [idle, working, complete, error]
    AgentStance:
      type: string
      enum: [bullish, bearish, neutral, not_evaluable]
    AnalysisRunStatus:
      type: string
      enum: [queued, running, complete, error, stopped]
    AnalysisRunRequest:
      type: object
      properties:
        accountId:
          type: string
          format: uuid
        asset:
          $ref: "#/components/schemas/AssetCode"
        question:
          type: string
          minLength: 1
          maxLength: 2000
      required: [accountId, asset, question]
    AnalysisRunStart:
      type: object
      properties:
        runId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/AnalysisRunStatus"
      required: [runId, status]
    StopAnalysisRunRequest:
      type: object
      properties:
        runId:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
      required: [runId, accountId]
    AgentEvidence:
      type: object
      properties:
        metric:
          type: string
        value:
          type: string
        source:
          type: string
        timestamp:
          type: string
          format: date-time
        dataStatus:
          $ref: "#/components/schemas/DataStatus"
      required: [metric, value, source, timestamp, dataStatus]
    DataSourceStatus:
      type: object
      properties:
        source:
          type: string
        status:
          $ref: "#/components/schemas/DataStatus"
        checkedAt:
          type: string
          format: date-time
        observedAt:
          type: [string, "null"]
          format: date-time
        ageMinutes:
          type: [number, "null"]
        detail:
          type: string
      required: [source, status, checkedAt, observedAt, ageMinutes, detail]
    AgentResult:
      type: object
      properties:
        agentId:
          type: string
        displayName:
          type: string
        status:
          $ref: "#/components/schemas/AgentStatus"
        stance:
          $ref: "#/components/schemas/AgentStance"
        summary:
          type: string
        confidence:
          type: integer
          minimum: 0
          maximum: 100
        bullishFactors:
          type: array
          items:
            type: string
        bearishFactors:
          type: array
          items:
            type: string
        risks:
          type: array
          items:
            type: string
        rationale:
          type: string
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/AgentEvidence"
        source:
          type: string
        timestamp:
          type: string
          format: date-time
        dataStatus:
          $ref: "#/components/schemas/DataStatus"
        dataSources:
          type: array
          items:
            $ref: "#/components/schemas/DataSourceStatus"
        error:
          type: [string, "null"]
      required: [agentId, displayName, status, stance, summary, confidence, bullishFactors, bearishFactors, risks, rationale, evidence, source, timestamp, dataStatus, dataSources, error]
    RunEvent:
      type: object
      properties:
        id:
          type: integer
        agent:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time
        kind:
          type: string
          enum: [info, working, complete, error]
      required: [id, agent, message, timestamp, kind]
    ConfidenceBreakdown:
      type: object
      properties:
        coverageScore:
          type: integer
        freshnessScore:
          type: integer
        agreementScore:
          type: integer
        sourceConsistencyScore:
          type: integer
        verificationScore:
          type: integer
        confirmationCount:
          type: integer
        contradictionCount:
          type: integer
        liveAgentCount:
          type: integer
        totalAgentCount:
          type: integer
        liveSourceCount:
          type: integer
        totalSourceCount:
          type: integer
        methodology:
          type: string
      required: [coverageScore, freshnessScore, agreementScore, sourceConsistencyScore, verificationScore, confirmationCount, contradictionCount, liveAgentCount, totalAgentCount, liveSourceCount, totalSourceCount, methodology]
    ScoreFactor:
      type: object
      properties:
        name:
          type: string
        value:
          type: [number, "null"]
        weight:
          type: number
        dataStatus:
          $ref: "#/components/schemas/DataStatus"
        explanation:
          type: string
      required: [name, value, weight, dataStatus, explanation]
    MarketCurrentData:
      type: object
      properties:
        asset:
          $ref: "#/components/schemas/AssetCode"
        priceEur:
          type: [number, "null"]
        priceUsd:
          type: [number, "null"]
        change24hPercent:
          type: [number, "null"]
        change7dPercent:
          type: [number, "null"]
        volume24hEur:
          type: [number, "null"]
        marketCapEur:
          type: [number, "null"]
        sourceDeviationPercent:
          type: [number, "null"]
        hourlyCandleAt:
          type: [string, "null"]
          format: date-time
        dailyCandleAt:
          type: [string, "null"]
          format: date-time
        sourceStatuses:
          type: array
          items:
            $ref: "#/components/schemas/DataSourceStatus"
      required: [asset, priceEur, priceUsd, change24hPercent, change7dPercent, volume24hEur, marketCapEur, sourceDeviationPercent, hourlyCandleAt, dailyCandleAt, sourceStatuses]
    FinalReport:
      type: object
      properties:
        stance:
          type: string
          enum: [bullish, bearish, neutral, not_evaluable]
        radarState:
          type: string
          enum: [stand_aside, observe, attractive_risk_reward]
        generatedAt:
          type: string
          format: date-time
        dataStatus:
          $ref: "#/components/schemas/DataStatus"
        currentData:
          $ref: "#/components/schemas/MarketCurrentData"
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/AgentEvidence"
        decision:
          type: string
          enum: [strong_long, long, neutral_wait, short, strong_short, no_clear_signal]
        summary:
          type: string
        confidenceScore:
          type: integer
          minimum: 0
          maximum: 100
        confidenceLabel:
          type: string
        riskScore:
          type: [integer, "null"]
          minimum: 0
          maximum: 100
        mainReasons:
          type: array
          items:
            type: string
        counterArguments:
          type: array
          items:
            type: string
        invalidation:
          type: string
        longScore:
          type: [number, "null"]
        shortScore:
          type: [number, "null"]
        scoreFactors:
          type: array
          items:
            $ref: "#/components/schemas/ScoreFactor"
        confidenceBreakdown:
          $ref: "#/components/schemas/ConfidenceBreakdown"
      required: [stance, radarState, generatedAt, dataStatus, currentData, evidence, decision, summary, confidenceScore, confidenceLabel, riskScore, mainReasons, counterArguments, invalidation, longScore, shortScore, scoreFactors, confidenceBreakdown]
    AnalysisRun:
      type: object
      properties:
        runId:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        asset:
          $ref: "#/components/schemas/AssetCode"
        question:
          type: string
        status:
          $ref: "#/components/schemas/AnalysisRunStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completedAt:
          type: [string, "null"]
          format: date-time
        agentResults:
          type: array
          items:
            $ref: "#/components/schemas/AgentResult"
        activity:
          type: array
          items:
            $ref: "#/components/schemas/RunEvent"
        finalReport:
          oneOf:
            - $ref: "#/components/schemas/FinalReport"
            - type: "null"
        error:
          type: [string, "null"]
      required: [runId, accountId, asset, question, status, createdAt, updatedAt, completedAt, agentResults, activity, finalReport, error]
    AnalysisHistoryItem:
      type: object
      properties:
        runId:
          type: string
          format: uuid
        asset:
          $ref: "#/components/schemas/AssetCode"
        question:
          type: string
        status:
          $ref: "#/components/schemas/AnalysisRunStatus"
        decision:
          type: [string, "null"]
        confidenceScore:
          type: [integer, "null"]
        createdAt:
          type: string
          format: date-time
      required: [runId, asset, question, status, decision, confidenceScore, createdAt]
    AnalysisHistory:
      type: object
      properties:
        runs:
          type: array
          items:
            $ref: "#/components/schemas/AnalysisHistoryItem"
      required: [runs]
    MarketAsset:
      type: object
      properties:
        symbol:
          $ref: "#/components/schemas/AssetCode"
        name:
          type: string
        category:
          type: string
          enum: [crypto, crypto_equity, big_tech, semiconductor, eu_equity, commodity]
        priceEur:
          type: [number, "null"]
        change24hPercent:
          type: [number, "null"]
        change7dPercent:
          type: [number, "null"]
        volume24hEur:
          type: [number, "null"]
        marketCapEur:
          type: [number, "null"]
        dataStatus:
          $ref: "#/components/schemas/DataStatus"
        sourceStatuses:
          type: array
          items:
            $ref: "#/components/schemas/DataSourceStatus"
        radarScore:
          type: [number, "null"]
        momentumRating:
          type: [number, "null"]
        signal:
          oneOf:
            - $ref: "#/components/schemas/FinalReport"
            - type: "null"
        sparkline:
          type: array
          items:
            type: number
      required: [symbol, name, category, priceEur, change24hPercent, change7dPercent, volume24hEur, marketCapEur, dataStatus, sourceStatuses, radarScore, momentumRating, signal, sparkline]
    RadarResponse:
      type: object
      properties:
        generatedAt:
          type: string
          format: date-time
        learningStatus:
          type: string
          enum: [saved, unavailable]
        assets:
          type: array
          items:
            $ref: "#/components/schemas/MarketAsset"
      required: [generatedAt, learningStatus, assets]
    RadarPerformanceItem:
      type: object
      properties:
        asset:
          $ref: "#/components/schemas/AssetCode"
        signalType:
          type: string
        stance:
          type: string
          enum: [bullish, bearish, neutral, not_evaluable]
        horizonHours:
          type: integer
          enum: [1, 24, 168]
        sampleCount:
          type: integer
          minimum: 0
        status:
          type: string
          enum: [insufficient_data, measured]
        directionalSampleCount:
          type: integer
          minimum: 0
        hits:
          type: integer
          minimum: 0
        hitRatePercent:
          type: [number, "null"]
        averageReturnPercent:
          type: [number, "null"]
      required: [asset, signalType, stance, horizonHours, sampleCount, status, directionalSampleCount, hits, hitRatePercent, averageReturnPercent]
    RadarPerformanceResponse:
      type: object
      properties:
        performance:
          type: array
          items:
            $ref: "#/components/schemas/RadarPerformanceItem"
        errorSources:
          type: array
          items:
            $ref: "#/components/schemas/RadarErrorSource"
      required: [performance, errorSources]
    RadarErrorSource:
      type: object
      properties:
        category:
          type: string
          enum: [missing_data, stale_data, source_disagreement, verification_mismatch, signal_conflict]
        signalCount:
          type: integer
          minimum: 0
      required: [category, signalCount]
    PaperPosition:
      type: object
      properties:
        positionId:
          type: string
          format: uuid
        runId:
          type: [string, "null"]
          format: uuid
        signalId:
          type: [string, "null"]
          format: uuid
        asset:
          $ref: "#/components/schemas/AssetCode"
        side:
          type: string
          enum: [long, short]
        notionalEur:
          type: number
        quantity:
          type: number
        entryPriceEur:
          type: number
        feeRateBps:
          type: integer
          minimum: 0
          maximum: 100
        entryFeeEur:
          type: number
        exitFeeEur:
          type: number
        currentPriceEur:
          type: [number, "null"]
        currentPriceDataStatus:
          $ref: "#/components/schemas/DataStatus"
        priceSources:
          type: array
          items:
            $ref: "#/components/schemas/DataSourceStatus"
        stopLossEur:
          type: [number, "null"]
        takeProfitEur:
          type: [number, "null"]
        openedAt:
          type: string
          format: date-time
        closedAt:
          type: [string, "null"]
          format: date-time
        exitPriceEur:
          type: [number, "null"]
        unrealizedPnlEur:
          type: [number, "null"]
        realizedPnlEur:
          type: [number, "null"]
        status:
          type: string
          enum: [open, closed]
        closeReason:
          type: [string, "null"]
      required: [positionId, runId, signalId, asset, side, notionalEur, quantity, entryPriceEur, feeRateBps, entryFeeEur, exitFeeEur, currentPriceEur, currentPriceDataStatus, priceSources, stopLossEur, takeProfitEur, openedAt, closedAt, exitPriceEur, unrealizedPnlEur, realizedPnlEur, status, closeReason]
    PaperPerformance:
      type: object
      properties:
        status:
          type: string
          enum: [insufficient_data, measured]
        signalCount:
          type: integer
          minimum: 0
        tradeCount:
          type: integer
        winnerCount:
          type: integer
        loserCount:
          type: integer
        winRate:
          type: [number, "null"]
        totalPnlEur:
          type: number
        profitFactor:
          type: [number, "null"]
        averageWinEur:
          type: [number, "null"]
        averageLossEur:
          type: [number, "null"]
        maxDrawdownEur:
          type: number
        byAsset:
          type: array
          items:
            $ref: "#/components/schemas/PaperPerformanceBreakdown"
        byStance:
          type: array
          items:
            $ref: "#/components/schemas/PaperPerformanceBreakdown"
        bySignalType:
          type: array
          items:
            $ref: "#/components/schemas/PaperPerformanceBreakdown"
        byTimeWindow:
          type: array
          items:
            $ref: "#/components/schemas/PaperPerformanceBreakdown"
        performanceByAgent:
          type: array
          items:
            type: object
            properties:
              agentId:
                type: string
